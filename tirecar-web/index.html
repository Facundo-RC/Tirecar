  function niceMax(max, ticks = 4) {
    if (max <= 0) return { max: 4, step: 1 };
    const rough = max / ticks, mag = Math.pow(10, Math.floor(Math.log10(rough))), norm = rough / mag;
    const step = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => s >= norm - 1e-9) * mag;
    return { max: step * ticks, step };
  }
  function monotonePath(pts) { // curva monótona (como d3.curveMonotoneX)
    const n = pts.length; if (n < 2) return '';
    if (n === 2) return `M${pts[0][0]},${pts[0][1]}L${pts[1][0]},${pts[1][1]}`;
    const dx = [], m = [], t = [];
    for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
    t[0] = m[0]; t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) {
      if (m[i - 1] * m[i] <= 0) t[i] = 0;
      else { const p = (m[i - 1] * dx[i] + m[i] * dx[i - 1]) / (dx[i - 1] + dx[i]); t[i] = (Math.sign(m[i - 1]) + Math.sign(m[i])) * Math.min(Math.abs(m[i - 1]), Math.abs(m[i]), 0.5 * Math.abs(p)) || 0; }
    }
    // tangentes de los extremos como d3
    const end = (h, s0, s1) => (h ? (3 * (s0) - s1) / 2 : s1);
    t[0] = end(1, m[0], t[1]); t[n - 1] = end(1, m[n - 2], t[n - 2]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < n - 1; i++) {
      const h = dx[i] / 3;
      d += `C${pts[i][0] + h},${pts[i][1] + h * t[i]},${pts[i + 1][0] - h},${pts[i + 1][1] - h * t[i + 1]},${pts[i + 1][0]},${pts[i + 1][1]}`;
    }
    return d;
  }
  function sparkSVG(values, color, id) {
    const W = 112, H = 56, top = 4, { max } = niceMax(Math.max(...values, 0));
    const pts = values.map((v, i) => [values.length > 1 ? (i * W) / (values.length - 1) : 0, top + (H - top) * (1 - v / max)]);
    const line = monotonePath(pts);
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">
      <defs><linearGradient id="spark-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line}L${W},${H}L0,${H}Z" fill="url(#spark-${id})" fill-opacity="0.6" stroke="none"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.75"/>
    </svg>`;
  }
  function renderBarChart(container, data) {
    const W = Math.max(280, container.clientWidth), H = 248;
    const L = 38, R = W - 4, T = 4, B = H - 30;
    const { max, step } = niceMax(Math.max(...data.map((d) => Math.max(d.ventas, d.cobranzas)), 0));
    const y = (v) => B - (v / max) * (B - T);
    const band = (R - L) / data.length, cxp = (i) => L + band * i + band / 2;
    let g = '';
    for (let v = 0; v <= max + 1e-6; v += step) g += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="hsl(var(--border))" stroke-dasharray="3 3"/><text x="${L - 8}" y="${y(v)}" dy="0.355em" text-anchor="end" font-size="11" fill="hsl(var(--muted-foreground))">${Math.round(v / 1e3)}k</text>`;
    const bars = data.map((d, i) => {
      const h = B - y(d.ventas), x = cxp(i) - 11, r = Math.min(4, h / 2);
      return h > 0 ? `<path d="M${x},${B}V${B - h + r}Q${x},${B - h} ${x + r},${B - h}H${x + 22 - r}Q${x + 22},${B - h} ${x + 22},${B - h + r}V${B}Z" fill="url(#barVentas)"/>` : '';
    }).join('');
    const pts = data.map((d, i) => [cxp(i), y(d.cobranzas)]);
    const labels = data.map((d, i) => `<text x="${cxp(i)}" y="${B + 18}" text-anchor="middle" font-size="11" fill="hsl(var(--muted-foreground))">${d.mes}</text>`).join('');
    const dots = pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="hsl(var(--card))" stroke="hsl(var(--primary))" stroke-width="2"/>`).join('');
    container.innerHTML = `<div class="relative h-full w-full"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="block">
      <defs><linearGradient id="barVentas" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="hsl(var(--brand))" stop-opacity="1"/><stop offset="100%" stop-color="hsl(var(--brand))" stop-opacity="0.55"/></linearGradient></defs>
      ${g}<rect id="chart-cursor" x="0" y="${T}" width="${band}" height="${B - T}" fill="hsl(var(--muted))" opacity="0" />
      ${bars}<path d="${monotonePath(pts)}" fill="none" stroke="hsl(var(--primary))" stroke-width="2"/>${dots}${labels}
    </svg><div id="chart-tip" class="pointer-events-none absolute hidden rounded-lg border bg-card p-3 shadow-lg"></div></div>`;
    const svg = $('svg', container), cur = $('#chart-cursor', container), tip = $('#chart-tip', container);
    svg.addEventListener('mousemove', (ev) => {
      const rect = svg.getBoundingClientRect(), mx = ev.clientX - rect.left;
      const i = Math.floor((mx - L) / band);
      if (i < 0 || i >= data.length) { cur.setAttribute('opacity', 0); tip.classList.add('hidden'); return; }
      cur.setAttribute('x', L + band * i); cur.setAttribute('opacity', 0.5);
      const d = data[i];
      tip.innerHTML = `<p class="mb-2 text-[11px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">${d.mes}</p><div class="space-y-1">
        <div class="flex items-center gap-2 text-[12px]"><span class="h-2 w-2 rounded-full" style="background:hsl(var(--brand))"></span><span class="text-muted-foreground">Facturado</span><span class="ml-auto pl-3 font-semibold text-foreground tnum">${money(d.ventas)}</span></div>
        <div class="flex items-center gap-2 text-[12px]"><span class="h-2 w-2 rounded-full" style="background:hsl(var(--primary))"></span><span class="text-muted-foreground">Cobrado</span><span class="ml-auto pl-3 font-semibold text-foreground tnum">${money(d.cobranzas)}</span></div></div>`;
      tip.classList.remove('hidden');
      const tx = cxp(i) + band / 2 + 10, tw = tip.offsetWidth;
      tip.style.left = (tx + tw > W ? cxp(i) - band / 2 - tw - 10 : tx) + 'px';
      tip.style.top = Math.max(0, ev.clientY - rect.top - 40) + 'px';
    });
    svg.addEventListener('mouseleave', () => { cur.setAttribute('opacity', 0); tip.classList.add('hidden'); });
  }

  // ---------- PANEL ----------
  const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  function dashboardData() {
    const now = new Date(), Y = now.getUTCFullYear(), M = now.getUTCMonth();
    const ym = (y, m) => { const d = new Date(Date.UTC(y, m, 1)); return d.toISOString().slice(0, 7); };
    const pedidos = E.list('Pedido').filter((p) => p.estado !== 'cancelado');
    const pagos = E.list('Pago'), clientes = E.list('Cliente'), productos = E.list('Producto');
    const ventasDe = (k) => pedidos.filter((p) => String(p.fecha).slice(0, 7) === k).reduce((s, p) => s + N(p.total), 0);
    const cobrosDe = (k) => pagos.filter((p) => String(p.fecha).slice(0, 7) === k).reduce((s, p) => s + N(p.monto), 0);
    const cur = ym(Y, M), prev = ym(Y, M - 1);
    const ventasMes = ventasDe(cur), ventasPrev = ventasDe(prev);
    const serie = [];
    for (let i = 10; i >= 0; i--) { const k = ym(Y, M - i); serie.push({ mes: MESES[Number(k.slice(5, 7)) - 1], ventas: ventasDe(k), cobranzas: cobrosDe(k) }); }
    const prodMap = Object.fromEntries(productos.map((p) => [p.id, p]));
    const agg = {};
    pedidos.filter((p) => String(p.fecha).slice(0, 7) === cur).forEach((p) => (p.items || []).forEach((it) => {
      const a = agg[it.producto_id] || (agg[it.producto_id] = { sku: it.codigo, nombre: it.nombre, unidades: 0, ingreso: 0, categoria: prodMap[it.producto_id]?.categoria || '—' });
      a.unidades += N(it.cantidad); a.ingreso += N(it.cantidad) * N(it.precio_usd);
    }));
    const ciudad = Object.fromEntries(clientes.map((c) => [c.id, c.ciudad]));
    const imps = E.list('Importacion').filter((i) => ['en_transito', 'en_aduana'].includes(i.estado)).sort(byStr('eta'));
    const dias = new Date(Date.UTC(Y, M + 1, 0)).getUTCDate() - now.getUTCDate();
    return {
      ventasMes, objetivo: 60000, diasRestantes: dias,
      deltaVentas: ventasPrev > 0 ? ((ventasMes - ventasPrev) / ventasPrev * 100).toFixed(1) : '0.0',
      abiertos: E.list('Pedido').filter((p) => ['confirmado', 'en_preparacion', 'despachado'].includes(p.estado)).length,
      enPreparacion: E.list('Pedido').filter((p) => p.estado === 'en_preparacion').length,
      porCobrar: clientes.reduce((s, c) => s + N(c.saldo), 0), clientesConSaldo: clientes.filter((c) => N(c.saldo) > 0).length,
      criticos: productos.filter((p) => N(p.stock) < N(p.stock_minimo)).sort((a, b) => N(a.stock) / N(a.stock_minimo) - N(b.stock) / N(b.stock_minimo)),
      skus: productos.length, serie,
      pedidos: E.list('Pedido').sort((a, b) => String(b.fecha).localeCompare(a.fecha) || String(b.numero).localeCompare(a.numero)).slice(0, 6).map((p) => ({ ...p, cliente: p.cliente_nombre, ciudad: ciudad[p.cliente_id] })),
      top: Object.values(agg).sort((a, b) => b.ingreso - a.ingreso).slice(0, 5),
      importaciones: imps, valorEnTransito: imps.reduce((s, i) => s + N(i.monto_usd) + N(i.flete_usd), 0),
    };
  }

        ${Kpi({ label: 'Pedidos abiertos', value: num(e.abiertos), hint: `${e.enPreparacion} en preparación`, tone: 'ink', icon: 'shopping-cart' })}
        ${Kpi({ label: 'Cuentas por cobrar', value: money(e.porCobrar), hint: `${e.clientesConSaldo} gomerías con saldo`, tone: 'amber', icon: 'wallet', series: e.serie.map((s) => s.cobranzas), id: 'amber' })}
        ${Kpi({ label: 'Artículos bajo mínimo', value: num(e.criticos.length), hint: `sobre ${num(e.skus)} artículos`, tone: 'rose', icon: 'package-x' })}

    const draw = () => renderBarChart(box, e.serie);

  // ---------- VENDEDORES ----------
  function statsVendedor(id) {
    const mes = new Date().toISOString().slice(0, 7);
    const ped = E.list('Pedido').filter((p) => p.vendedor_id === id && p.estado !== 'cancelado');
    const delMes = ped.filter((p) => String(p.fecha).slice(0, 7) === mes);
    return {
      ped, delMes,
      totalMes: delMes.reduce((s, p) => s + N(p.total), 0),
      total: ped.reduce((s, p) => s + N(p.total), 0),
      clientes: new Set(ped.map((p) => p.cliente_id)).size,
      abiertos: ped.filter((p) => ['confirmado', 'en_preparacion', 'despachado'].includes(p.estado)).length,
    };
  }
  // ventas por mes de un vendedor (sin pedidos cancelados)
  const MESES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const MESES_C = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  function ventasMensuales(id, anio) {
    const meses = MESES_C.map((mes, i) => ({ i, mes, total: 0, pedidos: 0, facturado: 0, clientes: new Set() }));
    E.list('Pedido').forEach((p) => {
      if (p.vendedor_id !== id || p.estado === 'cancelado') return;
      const f = String(p.fecha || '');
      if (f.slice(0, 4) !== String(anio)) return;
      const m = meses[Number(f.slice(5, 7)) - 1]; if (!m) return;
      m.total += N(p.total); m.pedidos++; m.clientes.add(p.cliente_id);
      if (p.factura_estado === 'facturado') m.facturado += N(p.total);
    });
    return meses;
  }
  const aniosVendedor = (id) => {
    const s = new Set(E.list('Pedido').filter((p) => p.vendedor_id === id && p.fecha).map((p) => Number(String(p.fecha).slice(0, 4))));
    s.add(new Date().getFullYear());

  };
  function renderVentasVendedor(container, data, anio) {

    const y = (v) => B - (v / max) * (B - T);
    const band = (R - L) / 12, bw = Math.min(34, band * 0.62), cxp = (i) => L + band * i + band / 2;
    const hoy = new Date(), mesAct = hoy.getFullYear() === anio ? hoy.getMonth() : -1;
    const k = (v) => (v >= 1e6 ? (v / 1e6).toFixed(1).replace('.0', '') + 'M' : v >= 1e3 ? Math.round(v / 1e3) + 'k' : String(Math.round(v)));
    let g = '';
    for (let v = 0; v <= max + 1e-6; v += step) g += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="hsl(var(--border))" stroke-dasharray="3 3"/><text x="${L - 8}" y="${y(v)}" dy="0.355em" text-anchor="end" font-size="11" fill="hsl(var(--muted-foreground))">${k(v)}</text>`;
    const bars = data.map((d, i) => {
      const h = B - y(d.total), x = cxp(i) - bw / 2, r = Math.min(4, h / 2);
      const fill = i === mesAct ? 'hsl(var(--brand))' : 'hsl(var(--brand) / 0.55)';
      const val = d.total > 0 ? `<text x="${cxp(i)}" y="${B - h - 6}" text-anchor="middle" font-size="10.5" font-weight="600" fill="hsl(var(--foreground))">${k(d.total)}</text>` : '';
      return h > 0 ? `<path d="M${x},${B}V${B - h + r}Q${x},${B - h} ${x + r},${B - h}H${x + bw - r}Q${x + bw},${B - h} ${x + bw},${B - h + r}V${B}Z" fill="${fill}"/>${val}` : '';
    }).join('');
    const labels = data.map((d, i) => `<text x="${cxp(i)}" y="${B + 18}" text-anchor="middle" font-size="11" font-weight="${i === mesAct ? 600 : 400}" fill="hsl(var(--${i === mesAct ? 'foreground' : 'muted-foreground'}))">${d.mes}</text>`).join('');
    container.innerHTML = `<div class="relative w-full"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="block" role="img" aria-label="Ventas por mes ${anio}">

    const svg = $('svg', container), cur = $('[data-cursor]', container), tip = $('[data-tip]', container);
    svg.addEventListener('mousemove', (ev) => {
      const rect = svg.getBoundingClientRect(), i = Math.floor((ev.clientX - rect.left - L) / band);
      if (i < 0 || i > 11) { cur.setAttribute('opacity', 0); tip.classList.add('hidden'); return; }
      cur.setAttribute('x', L + band * i); cur.setAttribute('opacity', 0.6);
      const d = data[i], prev = i > 0 ? data[i - 1].total : null;
      const delta = prev ? Math.round((d.total - prev) / prev * 100) : null;
      tip.innerHTML = `<p class="mb-2 text-[11px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">${MESES_L[i]} ${anio}</p>
        <p class="font-heading text-[18px] font-semibold leading-none tnum">${money(d.total)}</p>
        <div class="mt-2 space-y-0.5 text-[11.5px] text-muted-foreground"><p>${num(d.pedidos)} pedidos · ${num(d.clientes.size)} gomerías</p>${d.facturado ? `<p>Con factura en Fixed: <span class="font-medium text-foreground">${money(d.facturado)}</span></p>` : ''}${delta !== null && d.total ? `<p class="${delta >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)}% vs. ${MESES_L[i - 1].toLowerCase()}</p>` : ''}</div>`;
      tip.classList.remove('hidden');
      const tx = cxp(i) + band / 2 + 8, tw = tip.offsetWidth;
      tip.style.left = (tx + tw > W ? cxp(i) - band / 2 - tw - 8 : tx) + 'px';

          <thead><tr class="${TH_ROW}"><th class="px-4 py-2.5 font-semibold">Pedido</th><th class="px-4 py-2.5 font-semibold">Gomería</th><th class="px-4 py-2.5 font-semibold">Vendedor</th><th class="px-4 py-2.5 font-semibold">Fecha</th><th class="px-4 py-2.5 text-right font-semibold">Ítems</th><th class="px-4 py-2.5 font-semibold">Pago</th><th class="px-4 py-2.5 font-semibold">Estado</th><th class="px-4 py-2.5 font-semibold">Factura</th><th class="px-4 py-2.5 text-right font-semibold">Total</th></tr></thead>
          <tbody class="divide-y text-[12.5px]">${k.map((e) => `<tr data-row="${e.id}" class="${cx('cursor-pointer transition-colors hover:bg-muted/40', st.open.has(e.id) && 'bg-muted/40')}">
            <td class="px-4 py-3 font-medium text-foreground tnum"><span class="inline-flex items-center gap-1.5">${ic('chevron-right', cx('h-3.5 w-3.5 text-muted-foreground transition-transform', st.open.has(e.id) && 'rotate-90'))}${esc(e.numero)}</span></td>
            <td class="px-4 py-3 font-medium text-foreground"><a class="hover:text-brand" href="#cliente-${e.cliente_id}">${esc(e.cliente_nombre)}</a></td>
            <td class="px-4 py-3">${VendChip(e.vendedor_id, e.vendedor_nombre)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-muted-foreground tnum">${fdate(e.fecha)}</td>

            <td class="px-4 py-3 text-muted-foreground">${pagoLabel(e.forma_pago)}</td>
            <td class="px-4 py-3">${Badge(e.estado)}</td>

            <td class="px-4 py-3 text-right font-semibold text-foreground tnum">${money(e.total)}</td></tr>${st.open.has(e.id) ? `<tr class="bg-muted/20"><td colspan="9" class="px-4 pb-4 pt-1">${PedidoDesplegado(e)}</td></tr>` : ''}`).join('')}</tbody>
        </table></div>`;
    };
    main.innerHTML = `
      ${PageHeader({ eyebrow: 'Comercial', title: 'Pedidos', description: 'Pedidos de gomerías, estado de preparación y despacho.', actions: `<a href="#nuevo-pedido" class="${BTN_PRIMARY}">${ic('plus', 'h-3.5 w-3.5')}Nuevo pedido</a>` })}
      <div id="stats" class="grid grid-cols-1 gap-3 sm:grid-cols-3"></div>
      <div class="${cx('mt-4 overflow-hidden rounded-xl border bg-card', CARD_SHADOW)}">
        <div class="flex flex-col gap-3 border-b p-3">
          <div class="flex flex-col gap-2 sm:flex-row">
            <div class="relative flex-1">${ic('search', 'pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground')}<input id="q" value="${esc(st.q)}" placeholder="Buscar por número o gomería…" class="${INPUT} pl-9"></div>
            <select id="vend" class="${SELECT} sm:w-52"></select>
          </div>
          <div id="filters" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div id="list"></div>
      </div>`;
    $('#q').addEventListener('input', (e) => { st.q = e.target.value; render(); });
    $('#vend').addEventListener('change', (e) => { st.vend = e.target.value; render(); });
    $('#filters').addEventListener('click', (e) => { const b = e.target.closest('[data-estado]'); if (b) { st.estado = b.dataset.estado; render(); } });
    $('#list').addEventListener('click', (e) => {
      if (e.target.closest('a,button,select,input')) return;
      const tr = e.target.closest('tr[data-row]'); if (!tr) return;
      const id = tr.dataset.row; st.open.has(id) ? st.open.delete(id) : st.open.add(id); render();
    });
    render();
    return { refresh: render };
  }

  // Pedido completo desplegado (se usa en Pedidos y en Remitos)
  function PedidoDesplegado(p) {
    const c = E.get('Cliente', p.cliente_id) || {};
    const items = p.items || [];
    const bultos = items.reduce((s, it) => s + N(it.cantidad), 0);
    return `<div class="tc-drop overflow-hidden rounded-xl border bg-card shadow-[0_6px_20px_rgba(16,24,40,0.08)]">
      <div class="grid grid-cols-1 gap-4 border-b p-4 md:grid-cols-4">
        <div><p class="text-[10.5px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">Gomería</p><p class="mt-1 text-[13px] font-semibold text-foreground">${esc(p.cliente_nombre)}</p><p class="text-[11.5px] text-muted-foreground">${esc([c.direccion, c.ciudad].filter(Boolean).join(' · ') || '—')}</p><p class="text-[11.5px] text-muted-foreground">${esc([c.contacto, c.telefono].filter(Boolean).join(' · '))}</p></div>
        <div><p class="text-[10.5px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">Vendedor</p><p class="mt-1">${VendChip(p.vendedor_id, p.vendedor_nombre)}</p><p class="mt-1 text-[11.5px] text-muted-foreground">Pago: ${pagoLabel(p.forma_pago)}</p></div>
        <div><p class="text-[10.5px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">Fechas</p><p class="mt-1 text-[12.5px] text-foreground">Pedido: ${fdate(p.fecha)}</p><p class="text-[12.5px] text-foreground">Salida: ${fdate(salidaDe(p))} <span class="text-muted-foreground">· ${esc(remitoNum(p))}</span></p></div>
        <div><p class="text-[10.5px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">Estado</p><p class="mt-1">${Badge(p.estado)}</p><p class="mt-1 text-[11.5px] text-muted-foreground">${num(items.length)} artículos · ${num(bultos)} unidades</p></div>
      </div>
      <div class="border-b p-3">${FacturaBox(p)}</div>
      <div class="overflow-x-auto"><table class="w-full min-w-[560px] text-left">
        <thead><tr class="border-b text-[10.5px] uppercase tracking-[0.09em] text-muted-foreground"><th class="px-4 py-2 font-semibold">Código</th><th class="px-4 py-2 font-semibold">Artículo</th><th class="px-4 py-2 text-right font-semibold">Cantidad</th><th class="px-4 py-2 text-right font-semibold">Precio unit.</th><th class="px-4 py-2 text-right font-semibold">Subtotal</th></tr></thead>
        <tbody class="divide-y text-[12.5px]">${items.map((it) => `<tr><td class="px-4 py-2 text-[11.5px] uppercase tracking-wide text-muted-foreground">${esc(it.codigo)}</td><td class="px-4 py-2 font-medium text-foreground">${esc(it.nombre)}</td><td class="px-4 py-2 text-right tnum">${num(it.cantidad)}</td><td class="px-4 py-2 text-right text-muted-foreground tnum">${moneyAuto(it.precio_usd)}</td><td class="px-4 py-2 text-right font-semibold tnum">${money(N(it.cantidad) * N(it.precio_usd))}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="flex flex-col gap-3 border-t p-4 sm:flex-row sm:items-end sm:justify-between">
        <div class="max-w-md text-[12px] text-muted-foreground">${p.notas ? `<span class="font-semibold text-foreground">Notas:</span> ${esc(p.notas)}` : 'Sin notas.'}</div>
        <div class="flex flex-col items-stretch gap-3 sm:items-end">
          <dl class="w-full space-y-1 text-[12.5px] sm:w-56"><div class="flex justify-between"><dt class="text-muted-foreground">Subtotal</dt><dd class="tnum">${money(p.subtotal)}</dd></div><div class="flex justify-between"><dt class="text-muted-foreground">Descuento</dt><dd class="tnum">- ${money(p.descuento)}</dd></div><div class="flex justify-between border-t pt-1"><dt class="font-semibold">Total</dt><dd class="font-heading text-[15px] font-semibold tnum">${money(p.total)}</dd></div></dl>
          <div class="flex flex-wrap gap-2 sm:justify-end">
            <a href="#remito-${p.id}" class="${BTN_SECONDARY}">${ic('truck', 'h-3.5 w-3.5')}Ver remito</a>
            <a href="#pedido-${p.id}" class="${BTN_SECONDARY}">${ic('eye', 'h-3.5 w-3.5')}Abrir pedido</a>
            <a href="#editar-pedido-${p.id}" class="${BTN_PRIMARY}">${ic('pencil', 'h-3.5 w-3.5')}Modificar pedido</a>
          </div>
        </div>
      </div>
    </div>`;
  }

  function pagePedido(main, id) {
    const t = E.get('Pedido', id);
    if (!t) { main.innerHTML = `<div class="p-10 text-center text-[13px] text-muted-foreground">No encontramos este pedido.</div>`; return; }
    const T = t.items || [];
    main.innerHTML = `
      <a href="#pedidos" class="${BACK_LINK}">${ic('arrow-left', 'h-3.5 w-3.5')}Volver a pedidos</a>
      <div class="${cx('flex flex-col gap-4 rounded-2xl border bg-card p-5 sm:flex-row sm:items-center sm:justify-between', CARD_SHADOW)}">
        <div>
          <div class="flex items-center gap-2"><p class="text-[10.5px] font-semibold uppercase tracking-[0.18em] text-brand">Pedido</p><span id="badge">${Badge(t.estado)}</span></div>
          <h1 class="mt-1.5 font-heading text-[26px] font-semibold leading-tight tracking-tight tnum">${esc(t.numero)}</h1>
          <p class="mt-1 text-[13px] text-muted-foreground"><a href="#cliente-${t.cliente_id}" class="font-medium text-foreground hover:text-brand">${esc(t.cliente_nombre)}</a> · ${fdate(t.fecha)} · ${pagoLabel(t.forma_pago)}</p>
          <p class="mt-1 text-[12.5px] text-muted-foreground">Vendido por <a href="#vendedor-${esc(t.vendedor_id || '')}" class="font-medium text-foreground hover:text-brand">${esc(t.vendedor_nombre || vendedorNombre(t.vendedor_id))}</a></p>
        </div>
        <div class="flex flex-col items-start gap-3 sm:items-end"><div class="sm:text-right"><p class="mb-1 text-[10.5px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">Total</p><p class="font-heading text-[26px] font-semibold leading-none tracking-tight tnum">${money(t.total)}</p></div>
          <div class="flex flex-wrap gap-2"><a href="#remito-${t.id}" class="${BTN_SECONDARY}">${ic('truck', 'h-3.5 w-3.5')}Ver remito</a><a href="#editar-pedido-${t.id}" class="${BTN_PRIMARY}">${ic('pencil', 'h-3.5 w-3.5')}Modificar pedido</a></div></div>
      </div>
      <div class="mt-3">${FacturaBox(t)}</div>
      <div class="mt-3 flex flex-col gap-2 rounded-xl border bg-card p-4 sm:flex-row sm:items-center sm:justify-between">
        <div><p class="text-[12.5px] font-medium text-foreground">Estado del pedido</p><p class="text-[11.5px] text-muted-foreground">Actualizá el estado a medida que avanza la preparación y el despacho.</p></div>
        <div class="flex items-center gap-2"><select id="estado" class="${SELECT} sm:w-48">${options(ESTADOS, t.estado)}</select><button id="guardar" type="button" class="${BTN_PRIMARY}" disabled>${ic('check', 'h-3.5 w-3.5')}Guardar</button></div>
      </div>
      <div class="${cx('mt-4 overflow-hidden rounded-xl border bg-card', CARD_SHADOW)}">
        <div class="border-b p-4"><h2 class="font-heading text-[15px] font-semibold tracking-tight">Artículos del pedido</h2></div>
        <div class="overflow-x-auto"><table class="w-full min-w-[560px] text-left">
          <thead><tr class="${TH_ROW}"><th class="px-4 py-2.5 font-semibold">Artículo</th><th class="px-4 py-2.5 text-right font-semibold">Cantidad</th><th class="px-4 py-2.5 text-right font-semibold">Precio unit.</th><th class="px-4 py-2.5 text-right font-semibold">Subtotal</th></tr></thead>
          <tbody class="divide-y text-[12.5px]">${T.map((e) => `<tr>
            <td class="px-4 py-3"><span class="block font-medium text-foreground">${esc(e.nombre)}</span><span class="text-[11px] uppercase tracking-wide text-muted-foreground">${esc(e.codigo)}</span></td>
            <td class="px-4 py-3 text-right tnum">${num(e.cantidad)}</td>
            <td class="px-4 py-3 text-right text-muted-foreground tnum">${moneyAuto(e.precio_usd)}</td>
            <td class="px-4 py-3 text-right font-semibold tnum">${money(N(e.cantidad) * N(e.precio_usd))}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="flex justify-end border-t p-4"><dl class="w-full max-w-xs space-y-1.5 text-[13px]">
          <div class="flex justify-between"><dt class="text-muted-foreground">Subtotal</dt><dd class="font-medium tnum">${money(t.subtotal)}</dd></div>
          <div class="flex justify-between"><dt class="text-muted-foreground">Descuento</dt><dd class="font-medium tnum">- ${money(t.descuento)}</dd></div>
          <div class="flex justify-between border-t pt-1.5"><dt class="font-semibold">Total</dt><dd class="font-heading text-[17px] font-semibold tnum">${money(t.total)}</dd></div>
        </dl></div>
      </div>
      ${t.notas ? `<div class="mt-3 rounded-xl border bg-card p-4"><p class="text-[10.5px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">Notas</p><p class="mt-1 text-[12.5px] text-foreground">${esc(t.notas)}</p></div>` : ''}`;
    const sel = $('#estado'), btn = $('#guardar');
    sel.addEventListener('change', () => { btn.disabled = sel.value === t.estado; });
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try { await E.update('Pedido', t.id, { estado: sel.value }); t.estado = sel.value; $('#badge').innerHTML = Badge(t.estado); toast.success('Estado actualizado'); }
      catch (err) { toast.error(writeError(err)); btn.disabled = false; }
    });
  }

  function avisoFacturado(p) {
    return p && p.factura_estado === 'facturado' ? `<div class="mb-4 flex items-start gap-2 rounded-xl border border-amber-200 bg-amber-50 p-3 text-[12.5px] text-amber-800">${ic('circle-alert', 'mt-0.5 h-4 w-4 shrink-0')}<span>Este pedido ya tiene factura electrónica (${esc(factNum(p))}). Los cambios quedan en el ERP pero <b>no cambian la factura</b>: si hace falta, hacé la nota de crédito en Fixed.</span></div>` : '';
  }

  function pageNuevoPedido(main, editId) {
    setTimeout(() => { salidaPreset = ''; }, 0);
    const orig = editId ? E.get('Pedido', editId) : null;
    if (editId && !orig) { main.innerHTML = `<a href="#pedidos" class="${BACK_LINK}">${ic('arrow-left', 'h-3.5 w-3.5')}Volver a pedidos</a><div class="p-10 text-center text-[13px] text-muted-foreground">No encontramos este pedido.</div>`; return; }
    const clientes = E.list('Cliente').sort(byStr('nombre')), productos = E.list('Producto').sort(byStr('nombre'));
    const st = { items: orig ? JSON.parse(JSON.stringify(orig.items || [])) : [] };
    const volver = orig ? `#pedido-${orig.id}` : '#pedidos';
    main.innerHTML = `
      <a href="${volver}" class="${BACK_LINK}">${ic('arrow-left', 'h-3.5 w-3.5')}${orig ? 'Volver al pedido' : 'Volver a pedidos'}</a>
      ${avisoFacturado(orig)}
      ${PageHeader(orig
        ? { eyebrow: 'Comercial', title: `Modificar pedido ${orig.numero}`, description: 'Al guardar, el stock y el saldo de la gomería se ajustan solos con la diferencia.' }
        : { eyebrow: 'Comercial', title: 'Nuevo pedido', description: 'El stock se descuenta automáticamente y, si es cuenta corriente, se suma al saldo de la gomería.' })}
      <div class="grid grid-cols-1 gap-4 xl:grid-cols-3">
        <div class="space-y-4 xl:col-span-2">
          <div class="${cx('rounded-xl border bg-card p-4 sm:p-5', CARD_SHADOW)}">
            <h2 class="font-heading text-[15px] font-semibold tracking-tight">Datos del pedido</h2>
            <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
              ${Field('Gomería', `<select id="cliente" class="${SELECT}"><option value="">Elegir gomería…</option>${clientes.map((e) => `<option value="${e.id}"${orig && orig.cliente_id === e.id ? ' selected' : ''}>${esc(e.nombre)} · saldo ${money(e.saldo)}</option>`).join('')}</select>`, 'sm:col-span-2')}
              ${Field('Vendedor', `<select id="vendedor" class="${SELECT}"><option value="">Elegir vendedor…</option>${options(vendedores().map((v) => ({ value: v.id, label: v.nombre })), orig ? orig.vendedor_id : vendedorActual)}</select>`)}
              ${Field('Forma de pago', `<select id="forma" class="${SELECT}">${options(FORMAS_PAGO, orig ? orig.forma_pago : 'cuenta_corriente')}</select>`)}
              ${Field('Fecha del pedido', `<input id="fecha" type="date" class="${INPUT}" value="${esc(orig ? orig.fecha : today())}">`)}
              ${Field('Fecha de salida (remito)', `<input id="salida" type="date" class="${INPUT}" value="${esc(orig ? salidaDe(orig) : (salidaPreset || today()))}">`)}
              ${orig ? Field('Estado', `<select id="estado" class="${SELECT}">${options(ESTADOS, orig.estado)}</select>`, 'sm:col-span-2') : ''}
            </div>
          </div>
          <div class="${cx('rounded-xl border bg-card p-4 sm:p-5', CARD_SHADOW)}">
            <h2 class="font-heading text-[15px] font-semibold tracking-tight">Artículos</h2>
            <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-[1fr_96px_auto]">
              <select id="prod" class="${SELECT}"><option value="">Elegir artículo…</option>${productos.map((e) => `<option value="${e.id}">${esc(e.codigo)} · ${esc(e.nombre)} — ${moneyAuto(e.precio_usd)} · stock ${num(e.stock)}</option>`).join('')}</select>
              <input id="cant" type="number" min="1" class="${INPUT}" value="1" placeholder="Cant.">
              <button id="add" type="button" class="${BTN_SECONDARY}">${ic('plus', 'h-3.5 w-3.5')}Agregar</button>
            </div>
            <div id="items"></div>
          </div>
        </div>
        <div class="space-y-4"><div class="${cx('rounded-xl border bg-card p-4 sm:p-5 xl:sticky xl:top-20', CARD_SHADOW)}">
          <h2 class="font-heading text-[15px] font-semibold tracking-tight">Resumen</h2>
          <dl class="mt-3 space-y-2 text-[13px]">
            <div class="flex justify-between"><dt class="text-muted-foreground">Subtotal</dt><dd id="sub" class="font-medium tnum">US$ 0</dd></div>
            <div class="flex items-center justify-between gap-3"><dt class="text-muted-foreground">Descuento</dt><dd class="w-24"><input id="desc" type="number" min="0" class="${INPUT}" value="${esc(orig ? N(orig.descuento) : 0)}"></dd></div>
            <div class="flex justify-between border-t pt-2"><dt class="font-semibold">Total</dt><dd id="tot" class="font-heading text-[18px] font-semibold tnum">US$ 0</dd></div>
          </dl>
          ${orig ? `<p class="mt-2 rounded-lg bg-muted/60 px-3 py-2 text-[11.5px] text-muted-foreground">Total anterior: <span class="font-semibold text-foreground tnum">${money(orig.total)}</span></p>` : ''}
          ${Field('Notas', `<textarea id="notas" class="${TEXTAREA}" placeholder="Instrucciones de entrega, transporte, etc.">${esc(orig ? orig.notas || '' : '')}</textarea>`, 'mt-3')}
          <button id="crear" type="button" class="${BTN_PRIMARY} mt-3 w-full">${orig ? 'Guardar cambios' : 'Crear pedido'}</button>
          <a href="${volver}" class="${BTN_SECONDARY} mt-2 w-full">Cancelar</a>
        </div></div>
      </div>`;
    const sub = () => st.items.reduce((s, t) => s + N(t.cantidad) * N(t.precio_usd), 0);
    const tot = () => Math.max(0, sub() - N($('#desc').value));
    const renderItems = () => {
      $('#items').innerHTML = st.items.length === 0 ? `<p class="mt-4 rounded-lg bg-muted/50 px-3 py-6 text-center text-[12.5px] text-muted-foreground">Todavía no agregaste artículos a este pedido.</p>` : `
        <div class="mt-4 overflow-x-auto"><table class="w-full min-w-[520px] text-left">
          <thead><tr class="border-b text-[10.5px] uppercase tracking-[0.09em] text-muted-foreground"><th class="py-2 font-semibold">Artículo</th><th class="py-2 text-right font-semibold">Cant.</th><th class="py-2 text-right font-semibold">Precio</th><th class="py-2 text-right font-semibold">Subtotal</th><th class="py-2"></th></tr></thead>
          <tbody class="divide-y text-[12.5px]">${st.items.map((e) => `<tr>
            <td class="py-2.5"><span class="block font-medium text-foreground">${esc(e.nombre)}</span><span class="text-[11px] text-muted-foreground">${esc(e.codigo)}</span></td>
            <td class="py-2.5 text-right"><input type="number" min="1" data-qty="${e.producto_id}" value="${esc(e.cantidad)}" class="h-8 w-20 rounded-md border border-input bg-card px-2 text-right text-[12.5px] tnum focus:border-ring focus:outline-none focus:ring-2 focus:ring-ring/20"></td>
            <td class="py-2.5 text-right"><input type="number" min="0" step="0.01" data-price="${e.producto_id}" value="${esc(e.precio_usd)}" class="h-8 w-24 rounded-md border border-input bg-card px-2 text-right text-[12.5px] tnum focus:border-ring focus:outline-none focus:ring-2 focus:ring-ring/20"></td>
            <td class="py-2.5 text-right font-semibold tnum" data-sub="${e.producto_id}">${money(N(e.cantidad) * N(e.precio_usd))}</td>
            <td class="py-2.5 text-right"><button type="button" data-del="${e.producto_id}" class="rounded-md p-1 text-muted-foreground transition-colors hover:bg-rose-50 hover:text-rose-600" aria-label="Quitar">${ic('trash-2', 'h-3.5 w-3.5')}</button></td></tr>`).join('')}</tbody>
        </table></div>`;
      paintTotals();
    };
    const paintTotals = () => { $('#sub').textContent = money(sub()); $('#tot').textContent = money(tot()); };
    $('#desc').addEventListener('input', paintTotals);
    $('#items').addEventListener('click', (ev) => { const b = ev.target.closest('[data-del]'); if (b) { st.items = st.items.filter((t) => t.producto_id !== b.dataset.del); renderItems(); } });
    $('#items').addEventListener('input', (ev) => {
      const q = ev.target.dataset.qty, pr = ev.target.dataset.price, id = q || pr; if (!id) return;
      const it = st.items.find((x) => x.producto_id === id); if (!it) return;
      if (q) it.cantidad = N(ev.target.value); else it.precio_usd = N(ev.target.value);
      const cell = $(`[data-sub="${id}"]`); if (cell) cell.textContent = money(N(it.cantidad) * N(it.precio_usd));
      paintTotals();
    });
    $('#add').addEventListener('click', () => {
      const e = productos.find((p) => p.id === $('#prod').value);
      if (!e) { toast.error('Elegí un artículo'); return; }
      const t = N($('#cant').value);
      if (t <= 0) { toast.error('La cantidad debe ser mayor a cero'); return; }
      const ex = st.items.find((x) => x.producto_id === e.id);
      if (ex) ex.cantidad = N(ex.cantidad) + t; else st.items.push({ producto_id: e.id, codigo: e.codigo, nombre: e.nombre, cantidad: t, precio_usd: N(e.precio_usd) });
      $('#prod').value = ''; $('#cant').value = '1'; renderItems();
    });
    $('#crear').addEventListener('click', async () => {
      const i = clientes.find((c) => c.id === $('#cliente').value);
      if (!i) { toast.error('Elegí la gomería'); return; }
      const v = E.get('Vendedor', $('#vendedor').value);
      if (!v) { toast.error('Elegí quién vendió el pedido'); return; }
      if (st.items.length === 0) { toast.error('Agregá al menos un artículo'); return; }
      if (st.items.some((it) => N(it.cantidad) <= 0)) { toast.error('Hay artículos con cantidad cero'); return; }
      const btn = $('#crear'); btn.disabled = true; btn.textContent = orig ? 'Guardando…' : 'Creando pedido…';
      const items = st.items.map((it) => ({ ...it, cantidad: N(it.cantidad), precio_usd: N(it.precio_usd) }));
      const U = sub(), W = N($('#desc').value), G = Math.max(0, U - W), forma = $('#forma').value;
      const datos = { cliente_id: i.id, cliente_nombre: i.nombre, vendedor_id: v.id, vendedor_nombre: v.nombre, fecha: $('#fecha').value, fecha_salida: $('#salida').value || $('#fecha').value, forma_pago: forma, items, subtotal: U, descuento: W, total: G, notas: $('#notas').value };
      try {
        const r = await E.rpc('guardar_pedido', { p_id: orig ? orig.id : null, p: { ...datos, ...(orig ? { estado: $('#estado').value, modificado_por: USER.full_name || vendedorActual || '' } : {}) } });
        await recargar(['Pedido', 'Producto', 'Cliente']);
        toast.success(orig ? `Pedido ${orig.numero} actualizado` : `Pedido ${r.numero} creado`);
        location.hash = `#pedido-${r.id}`;
      } catch (err) { toast.error(writeError(err)); btn.disabled = false; btn.textContent = orig ? 'Guardar cambios' : 'Crear pedido'; }
    });
    renderItems();
  }

  // ---------- REMITOS (semana de lunes a domingo) ----------
  let semanaOffset = 0; // 0 = esta semana; vuelve a 0 cada vez que se abre la página
  let salidaPreset = ''; // fecha de salida sugerida al crear un pedido desde Remitos
  const ESTAMPA = { entregado: ['Entregado', 'text-emerald-600 border-emerald-600'], despachado: ['Despachado', 'text-violet-600 border-violet-600'] };
  function RemitoCard(p) {
    const c = E.get('Cliente', p.cliente_id) || {};
    const items = p.items || [];
    const bultos = items.reduce((s, it) => s + N(it.cantidad), 0);
    const est = ESTAMPA[p.estado];
    return `<article draggable="true" data-remito="${p.id}" class="remito-card group relative w-full cursor-grab overflow-hidden rounded-[3px] border bg-card text-foreground sm:w-[268px]" title="Arrastralo a otro día para cambiar la fecha de salida">
      <div class="remito-perf"></div>
      ${est ? `<span class="remito-sello ${est[1]}">${est[0]}</span>` : ''}
      <div class="px-4 pb-3 pt-2.5">
        <div class="flex items-start justify-between gap-2">
          <div><p class="text-[9.5px] font-bold uppercase tracking-[0.28em] text-brand">Remito</p><p class="font-mono text-[15px] font-semibold leading-tight">${esc(remitoNum(p))}</p></div>
          <div class="text-right"><p class="text-[9.5px] font-semibold uppercase tracking-[0.18em] text-muted-foreground">Salida</p><p class="font-mono text-[12.5px] font-medium">${fcorta(parseYmd(salidaDe(p)))}</p></div>
        </div>
        <div class="mt-2 border-t border-dashed pt-2">
          <p class="text-[9.5px] font-semibold uppercase tracking-[0.18em] text-muted-foreground">Destinatario</p>
          <p class="truncate text-[13px] font-semibold leading-snug">${esc(p.cliente_nombre)}</p>
          <p class="truncate text-[11px] text-muted-foreground">${esc([c.direccion, c.ciudad].filter(Boolean).join(' · ') || '—')}</p>
        </div>
        <ul class="mt-2 space-y-0.5 border-t border-dashed pt-2 font-mono text-[11px] leading-snug">${items.slice(0, 3).map((it) => `<li class="flex gap-2"><span class="w-9 shrink-0 text-right font-semibold tnum">${num(it.cantidad)}</span><span class="truncate text-muted-foreground">${esc(it.nombre)}</span></li>`).join('')}${items.length > 3 ? `<li class="pl-11 text-muted-foreground">+ ${items.length - 3} artículo${items.length - 3 === 1 ? '' : 's'} más</li>` : ''}</ul>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-dashed pt-2 text-[11px]">
          <span class="text-muted-foreground"><span class="font-semibold text-foreground tnum">${num(bultos)}</span> unid. · ${esc(p.numero)}</span>${est ? '' : Badge(p.estado)}
        </div>
        <div class="mt-2.5 flex items-center justify-between gap-2">
          <span class="text-[11.5px]">${VendChip(p.vendedor_id, p.vendedor_nombre)}</span>
          <div class="flex items-center gap-0.5">
            <button type="button" data-move="${p.id}" class="rounded-md p-1.5 text-muted-foreground transition-colors hover:bg-muted hover:text-foreground" title="Mover a otro día" aria-label="Mover a otro día">${ic('calendar-days', 'h-3.5 w-3.5')}</button>
            <a href="#editar-pedido-${p.id}" class="rounded-md p-1.5 text-muted-foreground transition-colors hover:bg-muted hover:text-foreground" title="Modificar" aria-label="Modificar">${ic('pencil', 'h-3.5 w-3.5')}</a>
            <a href="#remito-${p.id}" class="rounded-md p-1.5 text-muted-foreground transition-colors hover:bg-muted hover:text-foreground" title="Ver remito completo" aria-label="Ver remito completo">${ic('maximize-2', 'h-3.5 w-3.5')}</a>
          </div>
        </div>
      </div>
    </article>`;
  }

  function pageRemitos(main) {
    const st = { open: null };
    const ordenar = (arr) => arr.sort((a, b) => (N(a.orden_remito) - N(b.orden_remito)) || String(a.numero).localeCompare(String(b.numero)));
    const datosSemana = () => {
      const lunes = addDays(lunesDe(new Date()), 7 * semanaOffset), domingo = addDays(lunes, 6);
      const desde = ymd(lunes), hasta = ymd(domingo);
      const activos = E.list('Pedido').filter((p) => !['cancelado', 'borrador'].includes(p.estado));
      const semana = activos.filter((p) => salidaDe(p) >= desde && salidaDe(p) <= hasta);
      const atrasados = semanaOffset === 0 ? ordenar(activos.filter((p) => salidaDe(p) < desde && ['confirmado', 'en_preparacion'].includes(p.estado))) : [];
      return { lunes, domingo, desde, hasta, semana, atrasados };
    };
    const render = () => {
      const d = datosSemana();
      const rango = `${d.lunes.toLocaleDateString('es-UY', { day: 'numeric', month: 'long' })} al ${d.domingo.toLocaleDateString('es-UY', { day: 'numeric', month: 'long', year: 'numeric' })}`;
      const unidades = d.semana.reduce((s, p) => s + (p.items || []).reduce((a, it) => a + N(it.cantidad), 0), 0);
      const pendientes = d.semana.filter((p) => ['confirmado', 'en_preparacion'].includes(p.estado)).length;
      const hoy = today();
      $('#rem-head').innerHTML = `
        <div class="flex flex-col gap-3 rounded-xl border bg-card p-3 sm:flex-row sm:items-center sm:justify-between ${CARD_SHADOW}">
          <div class="flex items-center gap-2">
            <button type="button" data-week="-1" class="${BTN_SECONDARY} px-2.5" aria-label="Semana anterior">${ic('chevron-left', 'h-4 w-4')}</button>
            <div class="px-1"><p class="text-[10.5px] font-semibold uppercase tracking-[0.16em] text-muted-foreground">${semanaOffset === 0 ? 'Esta semana' : semanaOffset < 0 ? `Hace ${-semanaOffset} semana${semanaOffset === -1 ? '' : 's'}` : `Dentro de ${semanaOffset} semana${semanaOffset === 1 ? '' : 's'}`}</p><p class="font-heading text-[15px] font-semibold tracking-tight">Del ${esc(rango)}</p></div>
            <button type="button" data-week="1" class="${BTN_SECONDARY} px-2.5" aria-label="Semana siguiente">${ic('chevron-right', 'h-4 w-4')}</button>
            <button type="button" data-agregar="${semanaOffset === 0 ? today() : ymd(d.lunes)}" class="${BTN_PRIMARY} ml-1">${ic('plus', 'h-3.5 w-3.5')}Agregar pedido</button>
          </div>
          ${semanaOffset !== 0 ? `<button type="button" data-week="0" class="${BTN_PRIMARY}">${ic('calendar-days', 'h-3.5 w-3.5')}Volver a esta semana</button>` : `<p class="text-[12px] text-muted-foreground">Cada lunes arranca una semana nueva. Arrastrá un remito a otro día para cambiar su salida.</p>`}
        </div>
        <div class="mt-3 grid grid-cols-2 gap-3 lg:grid-cols-4">
          ${Stat({ label: 'Remitos de la semana', value: num(d.semana.length), hint: 'Pedidos que salen esta semana', tone: 'brand' })}
          ${Stat({ label: 'Unidades a despachar', value: num(unidades), hint: 'Suma de todos los artículos' })}
          ${Stat({ label: 'Gomerías', value: num(new Set(d.semana.map((p) => p.cliente_id)).size), hint: 'Destinos distintos' })}
          ${Stat({ label: 'Falta salir', value: num(pendientes), hint: 'Confirmados o en preparación', tone: pendientes ? 'danger' : 'success' })}
        </div>`;
      const lane = (fecha, titulo, sub, lista, extraCls = '', esAtraso = false) => `
        <section data-lane="${fecha}" class="lane rounded-xl border ${extraCls} p-3 transition-colors">
          <div class="flex flex-wrap items-center justify-between gap-2 px-1">
            <p class="flex items-center gap-2 text-[13px] font-semibold text-foreground">${titulo}</p>
            <span class="flex items-center gap-2"><span class="text-[11.5px] text-muted-foreground">${sub}</span>${esAtraso ? '' : `<button type="button" data-agregar="${fecha}" class="no-print inline-flex items-center gap-1 rounded-md border bg-card px-2 py-1 text-[11.5px] font-medium text-foreground transition-colors hover:border-brand hover:text-brand">${ic('plus', 'h-3 w-3')}Agregar</button>`}</span>
          </div>
          <div class="lane-drop mt-3 flex min-h-[64px] flex-wrap items-start gap-4">${lista.length ? lista.map(RemitoCard).join('') : `${esAtraso ? '' : `<button type="button" data-agregar="${fecha}" class="flex h-[64px] w-full items-center justify-center gap-1.5 rounded-lg border border-dashed text-[12px] text-muted-foreground transition-colors hover:border-brand hover:text-brand">${ic('plus', 'h-3.5 w-3.5')}Sin remitos · agregá un pedido o soltá uno acá</button>`}`}</div>
        </section>`;
      let html = '';
      if (d.atrasados.length) html += lane('atrasados', `${ic('triangle-alert', 'h-4 w-4 text-amber-600')}Pendientes de semanas anteriores`, `${d.atrasados.length} sin salir · arrastralos a un día de esta semana`, d.atrasados, 'border-amber-200 bg-amber-50/60', true);
      for (let i = 0; i < 7; i++) {
        const dia = addDays(d.lunes, i), f = ymd(dia);
        const lista = ordenar(d.semana.filter((p) => salidaDe(p) === f));
        const u = lista.reduce((s, p) => s + (p.items || []).reduce((a, it) => a + N(it.cantidad), 0), 0);
        html += lane(f, `${DIAS[i]} <span class="font-mono text-[12px] font-medium text-muted-foreground">${fcorta(dia)}</span>${f === hoy ? '<span class="rounded-md bg-brand px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-white">Hoy</span>' : ''}`, lista.length ? `${lista.length} remito${lista.length === 1 ? '' : 's'} · ${num(u)} unidades` : '—', lista, f === hoy ? 'border-brand/40 bg-brand/[0.03]' : (i >= 5 ? 'bg-muted/30' : 'bg-card/60'));
      }
      $('#rem-lanes').innerHTML = html;
    };
    main.innerHTML = `
      ${PageHeader({ eyebrow: 'Logística', title: 'Remitos', description: 'Los pedidos que salen en la semana, de lunes a domingo, día por día.' })}
      <div id="rem-head"></div>
      <div id="rem-lanes" class="mt-4 space-y-3"></div>`;

    // navegación de semanas
    main.addEventListener('click', (e) => {
      const w = e.target.closest('[data-week]');
      if (w) { const v = Number(w.dataset.week); semanaOffset = v === 0 ? 0 : semanaOffset + v; render(); return; }
      const mv = e.target.closest('[data-move]');
      if (mv) { moverDialog(E.get('Pedido', mv.dataset.move)); return; }
      const ag = e.target.closest('[data-agregar]');
      if (ag) { agregarRemitoDialog(ag.dataset.agregar, render); return; }
      if (e.target.closest('a,button')) return;
      const card = e.target.closest('[data-remito]');
      if (card) location.hash = `#remito-${card.dataset.remito}`;
    });

    // arrastrar y soltar entre días
    let dragId = null;
    main.addEventListener('dragstart', (e) => {
      const card = e.target.closest('[data-remito]'); if (!card) return;
      dragId = card.dataset.remito; card.classList.add('is-dragging');
      try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (er) { /* */ }
    });
    main.addEventListener('dragend', (e) => { const c = e.target.closest('[data-remito]'); if (c) c.classList.remove('is-dragging'); $$('.lane-over', main).forEach((x) => x.classList.remove('lane-over')); dragId = null; });
    main.addEventListener('dragover', (e) => {
      const ln = e.target.closest('[data-lane]'); if (!ln || !dragId || ln.dataset.lane === 'atrasados') return;
      e.preventDefault(); $$('.lane-over', main).forEach((x) => x !== ln && x.classList.remove('lane-over')); ln.classList.add('lane-over');
    });
    main.addEventListener('dragleave', (e) => { const ln = e.target.closest('[data-lane]'); if (ln && !ln.contains(e.relatedTarget)) ln.classList.remove('lane-over'); });
    main.addEventListener('drop', async (e) => {
      const ln = e.target.closest('[data-lane]'); if (!ln || !dragId || ln.dataset.lane === 'atrasados') return;
      e.preventDefault(); ln.classList.remove('lane-over');
      const id = dragId; dragId = null;
      const p = E.get('Pedido', id); if (!p) return;
      const fecha = ln.dataset.lane;
      // posición: antes de la tarjeta sobre la que se soltó
      const sobre = e.target.closest('[data-remito]');
      const enDia = ordenar(E.list('Pedido').filter((x) => x.id !== id && !['cancelado', 'borrador'].includes(x.estado) && salidaDe(x) === fecha));
      let pos = enDia.length;
      if (sobre && sobre.dataset.remito !== id) { const i = enDia.findIndex((x) => x.id === sobre.dataset.remito); if (i >= 0) pos = i; }
      enDia.splice(pos, 0, p);
      try {
        for (let i = 0; i < enDia.length; i++) {
          const x = enDia[i], cambios = {};
          if (N(x.orden_remito) !== (i + 1) * 10) cambios.orden_remito = (i + 1) * 10;
          if (x.id === id && salidaDe(x) !== fecha) cambios.fecha_salida = fecha;
          if (Object.keys(cambios).length) await E.update('Pedido', x.id, cambios);
        }
        if (salidaDe(p) !== fecha || p.fecha_salida !== fecha) toast.success(`${remitoNum(p)} sale el ${DIAS[(parseYmd(fecha).getDay() + 6) % 7].toLowerCase()} ${fcorta(parseYmd(fecha))}`);
        render();
      } catch (err) { toast.error(writeError(err)); render(); }
    });
    render();
    return { refresh: render };
  }

  // Elegir un pedido existente (o crear uno) para que salga un día de la semana
  function agregarRemitoDialog(fechaInicial, onDone) {
    const lunes = addDays(lunesDe(new Date()), 7 * semanaOffset);
    const st = { fecha: fechaInicial || today(), q: '' };
    const candidatos = () => E.list('Pedido').filter((p) => !['cancelado', 'entregado'].includes(p.estado))
      .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)) || String(b.numero).localeCompare(String(a.numero)));
    openModal({
      title: 'Agregar pedido al remito', description: 'Elegí el día de salida y el pedido. Si el pedido ya tenía otro día, se mueve.',
      body: `<div id="ag-dias" class="grid grid-cols-4 gap-1.5 sm:grid-cols-7"></div>
        <div class="mt-2">${Field('Otra fecha', `<input id="ag-fecha" type="date" class="${INPUT}" value="${esc(st.fecha)}">`)}</div>
        <div class="relative mt-3">${ic('search', 'pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground')}<input id="ag-q" placeholder="Buscar por número o gomería…" class="${INPUT} pl-9"></div>
        <div id="ag-lista" class="mt-2 max-h-[300px] divide-y overflow-y-auto rounded-lg border"></div>`,
      footer: `<button type="button" data-close class="${BTN_SECONDARY}">Cancelar</button><button type="button" id="ag-nuevo" class="${BTN_PRIMARY}">${ic('plus', 'h-3.5 w-3.5')}Crear pedido nuevo para ese día</button>`,
      onMount: (root) => {
        const pintar = () => {
          $('#ag-dias', root).innerHTML = [0, 1, 2, 3, 4, 5, 6].map((i) => { const f = ymd(addDays(lunes, i)); return `<button type="button" data-ag-dia="${f}" class="${cx('rounded-lg border px-1 py-2 text-center text-[12px] transition-colors hover:border-brand hover:bg-brand/5', st.fecha === f && 'border-brand bg-brand/10 font-semibold')}"><span class="block font-medium">${DIAS[i].slice(0, 3)}</span><span class="font-mono text-[11px] text-muted-foreground">${fcorta(addDays(lunes, i))}</span></button>`; }).join('');
          $('#ag-fecha', root).value = st.fecha;
          const q = st.q.trim().toLowerCase();
          const lista = candidatos().filter((p) => !q || String(p.numero).toLowerCase().includes(q) || String(p.cliente_nombre).toLowerCase().includes(q)).slice(0, 60);
          $('#ag-lista', root).innerHTML = lista.length === 0
            ? `<p class="p-6 text-center text-[12.5px] text-muted-foreground">${E.list('Pedido').length === 0 ? 'Todavía no hay pedidos cargados. Creá uno con el botón de abajo.' : 'No hay pedidos que coincidan.'}</p>`
            : lista.map((p) => { const ya = salidaDe(p) === st.fecha; return `<button type="button" data-ag-ped="${p.id}" ${ya ? 'disabled' : ''} class="flex w-full items-center justify-between gap-3 px-3 py-2.5 text-left transition-colors hover:bg-muted/50 disabled:cursor-default disabled:opacity-50">
                <span class="min-w-0"><span class="block truncate text-[12.5px] font-medium text-foreground">${esc(p.numero)} · ${esc(p.cliente_nombre)}</span><span class="text-[11px] text-muted-foreground">${(p.items || []).length} artículos · ${ya ? 'ya sale ese día' : 'sale ' + fcorta(parseYmd(salidaDe(p)))} · ${esc(BADGE[p.estado]?.label || p.estado || '')}</span></span>
                <span class="shrink-0 text-[12.5px] font-semibold tnum">${money(p.total)}</span></button>`; }).join('');
        };
        root.addEventListener('click', async (e) => {
          const dia = e.target.closest('[data-ag-dia]'); if (dia) { st.fecha = dia.dataset.agDia; pintar(); return; }
          const b = e.target.closest('[data-ag-ped]');
          if (b && !b.disabled) {
            const p = E.get('Pedido', b.dataset.agPed); b.disabled = true;
            const orden = Math.max(0, ...E.list('Pedido').filter((x) => salidaDe(x) === st.fecha).map((x) => N(x.orden_remito))) + 10;
            try { await E.update('Pedido', p.id, { fecha_salida: st.fecha, orden_remito: orden }); closeModal(); toast.success(`${remitoNum(p)} sale el ${fcorta(parseYmd(st.fecha))}`); onDone ? onDone() : route(); }
            catch (err) { toast.error(writeError(err)); b.disabled = false; }
          }
        });
        $('#ag-fecha', root).addEventListener('change', (e) => { if (e.target.value) { st.fecha = e.target.value; pintar(); } });
        $('#ag-q', root).addEventListener('input', (e) => { st.q = e.target.value; pintar(); });
        $('#ag-nuevo', root).addEventListener('click', () => { salidaPreset = st.fecha; closeModal(); location.hash = '#nuevo-pedido'; });
        pintar();
      },
    });
  }

  function moverDialog(p) {
    if (!p) return;
    const lunes = addDays(lunesDe(new Date()), 7 * semanaOffset);
    openModal({
      title: `Mover ${remitoNum(p)}`, description: `${p.cliente_nombre} · ¿qué día sale?`,
      body: `<div class="grid grid-cols-2 gap-2 sm:grid-cols-4">${[0, 1, 2, 3, 4, 5, 6].map((i) => { const f = ymd(addDays(lunes, i)); return `<button type="button" data-dia="${f}" class="${cx('rounded-lg border px-2 py-2.5 text-center text-[12.5px] transition-colors hover:border-brand hover:bg-brand/5', salidaDe(p) === f && 'border-brand bg-brand/10 font-semibold')}"><span class="block font-medium">${DIAS[i]}</span><span class="font-mono text-[11.5px] text-muted-foreground">${fcorta(addDays(lunes, i))}</span></button>`; }).join('')}</div>
        ${Field('Otra fecha', `<input id="mv-fecha" type="date" class="${INPUT}" value="${esc(salidaDe(p))}">`)}`,
      footer: `<button type="button" data-close class="${BTN_SECONDARY}">Cancelar</button><button type="button" id="mv-ok" class="${BTN_PRIMARY}">Mover</button>`,
      onMount: (root) => {
        const go = async (f) => {
          if (!f) return;
          try { await E.update('Pedido', p.id, { fecha_salida: f }); closeModal(); toast.success(`${remitoNum(p)} sale el ${fcorta(parseYmd(f))}`); if (refresh && refresh !== 'reroute') refresh(); else route(); }
          catch (err) { toast.error(writeError(err)); }
        };
        root.addEventListener('click', (e) => { const b = e.target.closest('[data-dia]'); if (b) go(b.dataset.dia); });
        $('#mv-ok', root).addEventListener('click', () => go($('#mv-fecha', root).value));
      },
    });
  }

  // Remito completo, con formato de remito en papel
  function pageRemito(main, id) {
    const p = E.get('Pedido', id);

  // ---------- CLIENTES ----------
  function clienteDialog(cliente, onSaved) {
    const f = { nombre: '', razon_social: '', rut: '', contacto: '', telefono: '', email: '', ciudad: '', departamento: 'Montevideo', direccion: '', limite_credito: '', vendedor_id: vendedorActual || '', saldo: '', ...(cliente || {}) };
    const inp = (k, ph = '', type = 'text') => `<input name="${k}" type="${type}"${type === 'number' ? ' min="0"' : ''} class="${INPUT}" value="${esc(f[k] ?? '')}"${ph ? ` placeholder="${esc(ph)}"` : ''}>`;
    openModal({
      title: cliente ? 'Editar gomería' : 'Nueva gomería', description: 'Datos comerciales y límite de cuenta corriente.',
      body: `<form id="cliente-form" class="grid grid-cols-2 gap-3">
        ${Field('Gomería', inp('nombre', 'Gomería El Rodado'), 'col-span-2')}${Field('Contacto', inp('contacto'))}${Field('Teléfono', inp('telefono'))}
        ${Field('RUT (es el código de la gomería)', inp('rut', '12 dígitos'))}${Field('Razón social', inp('razon_social', 'Como figura en DGI'))}
        ${Field('Email (recibe la factura)', inp('email'), 'col-span-2')}${Field('Dirección', inp('direccion'), 'col-span-2')}${Field('Ciudad', inp('ciudad'))}${Field('Departamento', `<select name="departamento" class="${SELECT}">${DEPTOS.map((x) => `<option${x === f.departamento ? ' selected' : ''}>${x}</option>`).join('')}</select>`)}
        ${Field('Límite de crédito USD', inp('limite_credito', '', 'number'))}${Field('Saldo actual USD', inp('saldo', '', 'number'))}${Field('Vendedor asignado', `<select name="vendedor_id" class="${SELECT}"><option value="">Sin asignar</option>${options(vendedores().map((v) => ({ value: v.id, label: v.nombre })), f.vendedor_id)}</select>`, 'col-span-2')}
      </form>`,
      footer: `<button type="button" data-close class="${BTN_SECONDARY}">Cancelar</button><button type="submit" form="cliente-form" class="${BTN_PRIMARY}">Guardar</button>`,
      onMount: (root) => $('#cliente-form', root).addEventListener('submit', async (e) => {
        e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
        if (!d.nombre.trim()) { toast.error('El nombre de la gomería es obligatorio'); return; }
        const rut = d.rut.replace(/\D/g, '');
        if (rut && rut.length !== 12) { toast.error('El RUT tiene que tener 12 dígitos'); return; }
        const i = { rut, razon_social: d.razon_social.trim(), departamento: d.departamento, nombre: d.nombre.trim(), contacto: d.contacto.trim(), telefono: d.telefono.trim(), email: d.email.trim(), ciudad: d.ciudad.trim(), direccion: d.direccion.trim(), limite_credito: N(d.limite_credito), saldo: N(d.saldo), vendedor_id: d.vendedor_id, vendedor: d.vendedor_id ? vendedorNombre(d.vendedor_id) : '', activo: true };
        const btn = $('button[form=cliente-form]'); btn.disabled = true;
        try {
          if (cliente?.id) { await E.update('Cliente', cliente.id, i); toast.success('Gomería actualizada'); } else { await E.create('Cliente', i); toast.success('Gomería creada'); }
          closeModal(); onSaved && onSaved();
        } catch (err) { toast.error(writeError(err)); btn.disabled = false; }
      }),
    });
  }

  function cobroDialog({ clienteFijo, clientes = [], onSaved }) {
    const first = clienteFijo || clientes[0];
    const st = { cliente_id: first?.id || '' };
    const sel = () => clientes.find((c) => c.id === st.cliente_id) || clienteFijo || null;
    openModal({
      title: 'Registrar cobro', description: 'Se descuenta del saldo de la cuenta corriente de la gomería.',
      body: `<form id="cobro-form" class="grid grid-cols-2 gap-3">
        ${Field('Gomería', clienteFijo ? `<div class="flex h-9 items-center rounded-lg border bg-muted/50 px-2.5 text-[13px] font-medium text-foreground">${esc(clienteFijo.nombre)}</div>` : `<select name="cliente_id" class="${SELECT}"><option value="">Elegir gomería…</option>${clientes.map((e) => `<option value="${e.id}"${e.id === st.cliente_id ? ' selected' : ''}>${esc(e.nombre)} · saldo ${money(e.saldo)}</option>`).join('')}</select>`, 'col-span-2')}
        ${Field('Monto USD', `<input name="monto" type="number" min="0" step="0.01" class="${INPUT}" value="${first?.saldo ? esc(first.saldo) : ''}">`)}
        ${Field('Fecha', `<input name="fecha" type="date" class="${INPUT}" value="${today()}">`)}
        ${Field('Método', `<select name="metodo" class="${SELECT}">${options(METODOS, 'transferencia')}</select>`)}
        ${Field('Referencia', `<input name="referencia" class="${INPUT}" placeholder="TRF-88410">`)}
        ${Field('Notas', `<textarea name="notas" class="${TEXTAREA}"></textarea>`, 'col-span-2')}
        <p id="saldo-info" class="col-span-2 rounded-lg bg-muted/60 px-3 py-2 text-[12px] text-muted-foreground"></p>
      </form>`,
      footer: `<button type="button" data-close class="${BTN_SECONDARY}">Cancelar</button><button type="submit" form="cobro-form" class="${BTN_PRIMARY}">Registrar cobro</button>`,
      onMount: (root) => {
        const form = $('#cobro-form', root), info = $('#saldo-info', root);
        const upd = () => { const C = sel(); if (!C) { info.classList.add('hidden'); return; } info.classList.remove('hidden'); info.innerHTML = `Saldo actual: <span class="font-semibold text-foreground">${money(C.saldo)}</span> · Saldo luego del cobro: <span class="font-semibold text-foreground">${money(Math.max(0, N(C.saldo) - N(form.monto.value)))}</span>`; };
        form.addEventListener('input', (e) => { if (e.target.name === 'cliente_id') st.cliente_id = e.target.value; upd(); });
        form.addEventListener('change', (e) => { if (e.target.name === 'cliente_id') st.cliente_id = e.target.value; upd(); });
        upd();
        form.addEventListener('submit', async (e) => {
          e.preventDefault(); const d = Object.fromEntries(new FormData(form)); const n = N(d.monto); const C = sel();
          if (!st.cliente_id || n <= 0) { toast.error('Elegí una gomería y un monto mayor a cero'); return; }
          const btn = $('button[form=cobro-form]'); btn.disabled = true;
          try {
            await E.rpc('registrar_cobro', { p: { cliente_id: st.cliente_id, fecha: d.fecha, monto: n, metodo: d.metodo, referencia: d.referencia.trim(), notas: d.notas.trim(), registrado_por: vendedorActual || '' } });
            await recargar(['Pago', 'Cliente']);
            toast.success(`Cobro de ${money(n)} registrado`); closeModal(); onSaved && onSaved();
          } catch (err) { toast.error(writeError(err)); btn.disabled = false; }
        });
      },
    });
  }

      $('#db-tiles', root).innerHTML = Object.entries(TABS).map(([k, x]) => { const n = x.rows().length; return `<button type="button" data-tab="${k}" class="${cx('rounded-xl border bg-card px-4 py-3 text-left transition-colors hover:border-brand/50', st.tab === k && 'border-brand ring-2 ring-brand/15')}"><span class="flex items-center gap-2 text-[10.5px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">${ic(x.icon, 'h-3.5 w-3.5')}${x.label}</span><span class="mt-1 block font-heading text-[20px] font-semibold leading-none tnum">${num(n)}</span><span class="mt-1 block text-[11px] text-muted-foreground">registros</span></button>`; }).join('');

  function pageFacturacion(main) {
    const st = { filtro: 'atencion' };

      const P = E.list('Pedido');
      const cnt = (s) => P.filter((p) => p.factura_estado === s).length;

        ${esAdmin() ? `<button id="f-todos" type="button" class="${BTN_SECONDARY} mt-3 w-full">${ic('send', 'h-3.5 w-3.5')}Mandar ahora todos los pendientes</button>` : '<p class="mt-3 text-[11.5px] text-muted-foreground">Solo el administrador cambia estos ajustes.</p>'}
        ${sinRut.length ? `<div class="mt-3 rounded-lg bg-amber-50 p-3 text-[12px] text-amber-800"><b>${num(sinRut.length)} gomerías sin RUT:</b> ${sinRut.slice(0, 8).map((c) => `<a class="underline" href="#cliente-${c.id}">${esc(c.nombre)}</a>`).join(', ')}${sinRut.length > 8 ? '…' : ''}</div>` : ''}`;
      $('#f-tabs').innerHTML = [['atencion', 'Para revisar'], ['facturado', 'Facturados'], ['historico', 'Anteriores']].map(([v, l]) => `<button type="button" data-f="${v}" class="${cx('rounded-lg px-2.5 py-1.5 text-[12px] font-medium transition-colors', st.filtro === v ? 'bg-primary text-primary-foreground' : 'border bg-card text-muted-foreground hover:text-foreground')}">${l}</button>`).join('');
      $('#f-list').innerHTML = lista.length === 0 ? Empty({ icon: 'receipt', title: 'Nada por acá', text: st.filtro === 'atencion' ? 'No hay pedidos con problemas ni esperando factura.' : 'No hay pedidos en esta lista.' }) : `
        <div class="overflow-x-auto"><table class="w-full min-w-[860px] text-left">
          <thead><tr class="${TH_ROW}"><th class="px-4 py-2.5 font-semibold">Pedido</th><th class="px-4 py-2.5 font-semibold">Gomería</th><th class="px-4 py-2.5 font-semibold">Fecha</th><th class="px-4 py-2.5 font-semibold">Factura</th><th class="px-4 py-2.5 font-semibold">Detalle</th><th class="px-4 py-2.5 text-right font-semibold">Total</th><th class="px-4 py-2.5"></th></tr></thead>
          <tbody class="divide-y text-[12.5px]">${lista.slice(0, 300).map((p) => `<tr>

  }

  // ---------- router ----------
  const TITLES = { panel: 'Panel', pedidos: 'Pedidos', 'nuevo-pedido': 'Nuevo pedido', pedido: 'Detalle de pedido', clientes: 'Gomerías', cliente: 'Ficha de gomería', productos: 'Inventario', importaciones: 'Importaciones', cobranzas: 'Cobranzas', vendedores: 'Vendedores', vendedor: 'Vendedor', 'base-de-datos': 'Base de datos', facturacion: 'Facturación', proveedores: 'Proveedores', proveedor: 'Proveedor', remitos: 'Remitos', remito: 'Remito', editar: 'Modificar pedido' };
  let cleanup = null, refresh = null, pendingQuery = '';
  const currentView = () => decodeURIComponent(location.hash.replace(/^#/, '')) || 'panel';
  function route() {
    const view = currentView();
    closeModal();
    cleanup && cleanup(); cleanup = null; refresh = null;
    const isDb = view === 'base-de-datos';
    $('#layout').classList.toggle('hidden', isDb); $('#dbview').classList.toggle('hidden', !isDb);
    if (isDb) { const r = pageBaseDatos($('#dbview')); refresh = r.refresh; document.title = 'Base de datos · TIRECAR ERP'; window.scrollTo(0, 0); return; }
    paintChrome();
    const main = $('#main');
    if (!state.ready && !state.offline) {
      main.innerHTML = `<div class="flex flex-col items-center justify-center py-24 text-center"><span class="mb-3 h-8 w-8 animate-spin rounded-full border-2 border-muted border-t-brand"></span><p class="text-[13px] text-muted-foreground">${state.slow ? 'La base de datos está tardando en responder…' : 'Cargando datos de la base…'}</p></div>`;
      return;
    }
    let m, key = view;
    const run = (fn) => { const r = fn(); if (typeof r === 'function') cleanup = r; else if (r && r.refresh) refresh = r.refresh; };
    if (view === 'panel') { run(() => pageDashboard(main)); refresh = 'reroute'; }
    else if (view === 'pedidos') { const q = pendingQuery; pendingQuery = ''; run(() => pagePedidos(main, { q })); }
    else if (view === 'nuevo-pedido') pageNuevoPedido(main);
    else if ((m = view.match(/^editar-pedido-(.+)$/))) { key = 'editar'; pageNuevoPedido(main, m[1]); }
    else if (view === 'remitos') run(() => pageRemitos(main));
    else if ((m = view.match(/^remito-(.+)$/))) { key = 'remito'; pageRemito(main, m[1]); refresh = 'reroute'; }
    else if ((m = view.match(/^pedido-(.+)$/))) { key = 'pedido'; pagePedido(main, m[1]); refresh = 'reroute'; }
    else if (view === 'clientes') run(() => pageClientes(main));
    else if ((m = view.match(/^cliente-(.+)$/))) { key = 'cliente'; pageCliente(main, m[1]); refresh = 'reroute'; }
    else if (view === 'productos') run(() => pageProductos(main));
    else if (view === 'importaciones') run(() => pageCompras(main));
    else if (view === 'proveedores') run(() => pageProveedores(main));
    else if ((m = view.match(/^proveedor-(.+)$/))) { key = 'proveedor'; pageProveedor(main, m[1]); refresh = 'reroute'; }
    else if (view === 'cobranzas') run(() => pageCobranzas(main));
    else if (view === 'facturacion') run(() => pageFacturacion(main));
    else if (view === 'vendedores') { pageVendedores(main); refresh = 'reroute'; }
    else if ((m = view.match(/^vendedor-(.*)$/))) { key = 'vendedor'; pageVendedor(main, m[1]); refresh = 'reroute'; }
    else main.innerHTML = Empty({ icon: 'package-x', title: 'Página no encontrada', text: 'Volvé al panel para seguir trabajando.' });
    document.title = `${TITLES[key] || 'TIRECAR'} · TIRECAR ERP`;
    window.scrollTo(0, 0);
  }

  // Cuando la base cambia (otro vendedor cargó algo), se actualiza la vista sin perder lo que estás escribiendo.
  let refreshTimer = null;
  function onDataChange() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      autoVendedor();
      paintChrome();
      if ($('#modal-root').innerHTML) return;            // no interrumpir un formulario abierto
      if (!refresh) return;                               // p. ej. "Nuevo pedido": no se re-dibuja mientras se carga
      const a = document.activeElement;
      if (refresh === 'reroute') {
        if (a && $('#main').contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
        const y = window.scrollY; route(); window.scrollTo(0, y);
      } else refresh();
      vendedorGate();
    }, 150);
  }

  // ---------- conexión con la base (Supabase) ----------
  async function traer(name) {
    const { data, error } = await sb.from(COL[name]).select('*').limit(10000);
    if (error) throw error;
    cache[name] = data || [];
  }
  async function recargar(names) { await Promise.all(names.map(traer)); onDataChange(); }
  async function traerAjustes() {
    const { data } = await sb.from('ajustes').select('*');
    AJUSTES = Object.fromEntries((data || []).map((a) => [a.clave, a.valor]));
  }

  function pantallaLogin(msg = '', esError = false) {
    $('#layout').classList.add('hidden'); $('#dbview').classList.add('hidden');
    let box = $('#login');
    if (!box) { box = document.createElement('div'); box.id = 'login'; document.getElementById('app').appendChild(box); }
    box.innerHTML = `
      <div class="flex min-h-screen items-center justify-center bg-sidebar px-4">
        <form id="login-form" class="w-full max-w-sm rounded-2xl bg-card p-7 shadow-2xl">
          <div class="mb-6 flex items-center gap-3">
            <span class="relative flex h-10 w-10 items-center justify-center rounded-xl bg-brand shadow-lg shadow-brand/25"><span class="absolute inset-[7px] rounded-full border-[2.5px] border-white/90"></span><span class="h-1.5 w-1.5 rounded-full bg-white"></span></span>
            <span class="leading-none"><span class="block font-heading text-[17px] font-bold tracking-[0.14em]">TIRECAR</span><span class="mt-1 block text-[10px] font-medium uppercase tracking-[0.22em] text-muted-foreground">Import · ERP</span></span>
          </div>
          <h1 class="font-heading text-[20px] font-semibold tracking-tight">Entrar</h1>
          <p class="mb-5 mt-1 text-[12.5px] text-muted-foreground">Usá el email y la contraseña que te dieron.</p>
          <div class="space-y-3">
            ${Field('Email', `<input name="email" type="email" autocomplete="username" required class="${INPUT}">`)}
            ${Field('Contraseña', `<input name="password" type="password" autocomplete="current-password" required class="${INPUT}">`)}
          </div>
          <p id="login-msg" class="${cx('mt-3 min-h-[18px] text-[12px]', esError ? 'text-rose-600' : 'text-muted-foreground')}">${esc(msg)}</p>
          <button type="submit" class="${BTN_PRIMARY} mt-2 w-full !py-2.5">Entrar</button>
        </form>
      </div>`;
    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target));
      const b = $('button[type=submit]', e.target); b.disabled = true; b.textContent = 'Entrando…';
      const { error } = await sb.auth.signInWithPassword({ email: d.email.trim(), password: d.password });
      if (error) { pantallaLogin(/Invalid login/i.test(error.message) ? 'Email o contraseña incorrectos' : 'No se pudo entrar: ' + error.message, true); return; }
      iniciar();
    });
  }

  let canal = null;
  async function iniciar() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { pantallaLogin(); return; }
    ME = await E.rpc('mi_usuario', {}).catch(() => null);
    if (!ME) {
      await sb.auth.signOut();
      pantallaLogin('Tu usuario todavía no está habilitado en TIRECAR. Pedile al administrador que te agregue.', true);
      return;
    }
    $('#login')?.remove();
    USER.full_name = ME.nombre || session.user.email; USER.email = session.user.email;
    route();
    const timer = setTimeout(() => { state.slow = true; if (!state.ready) route(); }, 10000);
    try {
      await Promise.all([...Object.keys(COL).map(traer), traerAjustes()]);
      state.ready = true; state.offline = false; state.slow = false;
    } catch (e) {
      state.ready = true; state.offline = true;
      toast.error('No se pudo leer la base de datos');
    }
    clearTimeout(timer);
    autoVendedor(); route(); vendedorGate();
    // tiempo real: lo que carga el otro vendedor aparece solo
    if (canal) sb.removeChannel(canal);
    canal = sb.channel('tirecar')
      .on('postgres_changes', { event: '*', schema: 'public' }, (ch) => {
        if (ch.table === 'ajustes') { if (ch.new?.clave) AJUSTES[ch.new.clave] = ch.new.valor; onDataChange(); return; }
        const name = NAME_OF[ch.table]; if (!name) return;
        if (ch.eventType === 'DELETE') cache[name] = cache[name].filter((x) => x.id !== ch.old?.id);
        else {
          if (ch.old?.id && ch.new?.id && ch.old.id !== ch.new.id) cache[name] = cache[name].filter((x) => x.id !== ch.old.id);
          upsertCache(name, ch.new);
        }
        onDataChange();
      })
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { state.offline = true; paintChrome(); }
        if (status === 'SUBSCRIBED' && state.offline) { state.offline = false; recargar(Object.keys(COL)); }
      });
  }
  async function connect() {
    if (!sb) { state.ready = true; state.offline = true; route(); toast.error('Falta la configuración de Supabase'); return; }
    sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') pantallaLogin(); });
    iniciar();
  }

  shell();
  window.addEventListener('hashchange', () => { if (ME) { route(); vendedorGate(); } });
  connect();
})();
</script>
</body>
</html>
